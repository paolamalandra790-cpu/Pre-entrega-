name: CI - Pipeline de Pruebas Automaticas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr tests API + UI con Pytest
        run: |
          pytest --html=report.html --self-contained-html -v || true
          pytest tests_behave/test_behave_suite.py -v

      - name: Correr tests BDD con Behave
        run: |
          behave -f plain || true

      - name: Subir reporte HTML y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-qa
          path: |
            report.html
            logs/
            screenshots/
          retention-days: 90
